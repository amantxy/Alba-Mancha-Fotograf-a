<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AM96 Photo · Alba Mancha Fotografía</title>
  <meta name="description" content="Portfolio de fotografía profesional de Alba Mancha (AM96 Photo). Bodas, retratos, eventos y más.">
  <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AM96 Photo · Alba Mancha Fotografía">
  <meta property="og:description" content="Portfolio de fotografía profesional.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ccircle cx='32' cy='34' r='13' fill='none' stroke='%23c9a46a' stroke-width='5'/%3E%3Crect x='20' y='14' width='24' height='8' rx='3' fill='%23c9a46a'/%3E%3C/svg%3E">

  <!-- Aplica el tema antes de pintar para evitar parpadeos -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themePref = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="#/" id="brandLink">
        <span class="brand-name" data-edit="site.brand">AM96 Photo</span>
        <span class="brand-tagline" data-edit="site.tagline"></span>
      </a>

      <div class="header-actions">
        <a class="icon-btn" id="headerInstagram" href="https://instagram.com/am96photo" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" class="fill"/></svg>
        </a>
        <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Cambiar tema">
          <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
          <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
          <svg class="ico-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          <span class="theme-label" id="themeLabel">Sistema</span>
        </button>
      </div>
    </div>

    <nav class="main-nav" aria-label="Menú principal">
      <div class="nav-scroller" id="mainNav" role="list"></div>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <div class="loading" id="loading"><span class="spinner"></span></div>
  </main>

  <footer class="site-footer" id="siteFooter">
    <div class="footer-inner">
      <p class="footer-brand" data-edit="site.brand">AM96 Photo</p>
      <p class="footer-text" data-edit="site.footer"></p>
      <div class="footer-links">
        <a id="footerInstagram" href="https://instagram.com/am96photo" target="_blank" rel="noopener">@am96photo</a>
        <a id="footerEmail" href="mailto:am96photo@gmail.com">am96photo@gmail.com</a>
      </div>
      <p class="footer-copy">© <span id="year"></span> <span data-edit="site.title">Alba Mancha Fotografía</span> · <a href="#admin" class="admin-link" id="adminLink">Acceso</a></p>
    </div>
  </footer>

  <!-- Chat de contacto -->
  <button class="chat-fab" id="chatFab" type="button" aria-label="Abrir chat de contacto" aria-expanded="false" aria-controls="chatPanel">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
    <span class="chat-fab-label">¿Hablamos?</span>
  </button>

  <section class="chat-panel" id="chatPanel" role="dialog" aria-modal="false" aria-labelledby="chatTitle" hidden>
    <header class="chat-header">
      <div class="chat-avatar" aria-hidden="true">AM</div>
      <div>
        <h2 class="chat-title" id="chatTitle">Contacto</h2>
        <p class="chat-subtitle">Te respondo por email lo antes posible</p>
      </div>
      <button class="icon-btn chat-close" id="chatClose" type="button" aria-label="Cerrar chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="chat-messages" id="chatMessages" aria-live="polite"></div>
    <form class="chat-input" id="chatForm" autocomplete="on">
      <label class="sr-only" for="chatText">Escribe tu respuesta</label>
      <textarea id="chatText" rows="1" placeholder="Escribe aquí…" required></textarea>
      <button class="chat-send" type="submit" aria-label="Enviar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>
      </button>
    </form>
  </section>

  <!-- Visor de fotos -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visor de fotografías" hidden>
    <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <figure class="lb-figure">
      <img id="lbImg" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
